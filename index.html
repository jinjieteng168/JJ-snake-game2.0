<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>卡通大眼贪吃蛇 - 挑战版</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            /* 升级：现代感、电竞风的深紫夜霓虹渐变背景 */
            background: radial-gradient(circle, #251c4a 0%, #0e091a 100%);
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none; /* 阻止 iPad 自带的划动回弹刷新 */
        }
        #game-container {
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }
        canvas {
            display: block;
            background: #110e1c;
        }
        #ui-layer {
            position: absolute;
            top: 25px;
            left: 25px;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 0 4px 8px rgba(0,0,0,0.5);
            pointer-events: none;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui-layer">SCORE: <span id="score">000</span></div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');

        // --- 核心变量 ---
        let snake = [
            {x: 400, y: 300},
            {x: 385, y: 300},
            {x: 370, y: 300},
            {x: 355, y: 300}
        ];
        
        let radius = 12;       
        let speed = 4;         
        let angle = 0;         
        let targetAngle = 0;   
        let score = 0;
        let isGameOver = false; // 记录游戏是否结束

        // 卡通食物属性
        let food = {
            x: 0,
            y: 0,
            radius: 16, 
            pulse: 1,
            type: '🍎'   
        };

        // 随机卡通食物池
        const foodPool = ['🍎', '🍌', '🍓', '🍩', '🍕', '🍇', '🍉', '🥑', '🍔', '🍟', '🍦', '🍰'];

        function respawnFood() {
            food.x = Math.random() * (canvas.width - 100) + 50;
            food.y = Math.random() * (canvas.height - 100) + 50;
            food.type = foodPool[Math.floor(Math.random() * foodPool.length)];
        }

        // 初始化第一个食物
        respawnFood();

        // --- 核心逻辑：数据更新 ---
        function update() {
            if (isGameOver) return; // 如果死掉了，停止更新数据

            // 角度平滑漂移过渡
            let angleDiff = targetAngle - angle;
            angleDiff = Math.atan2(Math.sin(angleDiff), Math.cos(angleDiff));
            angle += angleDiff * 0.2; 

            // 计算蛇头新位置
            let head = {
                x: snake[0].x + Math.cos(angle) * speed,
                y: snake[0].y + Math.sin(angle) * speed
            };

            // 1. 边缘检测 -> 改为撞墙死 Game Over
            if (head.x > canvas.width || head.x < 0 || head.y > canvas.height || head.y < 0) {
                isGameOver = true;
                return;
            }

            snake.unshift(head);

            // 2. 碰撞检测：吃到食物
            let dx = head.x - food.x;
            let dy = head.y - food.y;
            let distance = Math.sqrt(dx * dx + dy * dy); 

            if (distance < radius + food.radius) {
                score += 10;
                scoreEl.innerText = score.toString().padStart(3, '0');
                respawnFood();
                speed += 0.15; // 每次吃到水果，速度加成稍微明显一点
            } else {
                snake.pop();
            }

            // 3. 自撞检测（从第15节开始算，给头部转弯留足圆弧空间）
            for (let i = 15; i < snake.length; i++) {
                let sDx = head.x - snake[i].x;
                let sDy = head.y - snake[i].y;
                let sDist = Math.sqrt(sDx * sDx + sDy * sDy);
                if (sDist < radius * 0.8) {
                    isGameOver = true; // 咬到自己，进入 Game Over 状态
                    return;
                }
            }

            // 食物缩放呼吸动效
            food.pulse = 1 + Math.sin(Date.now() * 0.005) * 0.15;
        }

        // 游戏重置复活函数
        function resetGame() {
            score = 0;
            speed = 4;
            angle = 0;
            targetAngle = 0;
            isGameOver = false;
            scoreEl.innerText = "000";
            snake = [
                {x: 400, y: 300},
                {x: 385, y: 300},
                {x: 370, y: 300},
                {x: 355, y: 300}
            ];
            respawnFood();
        }

        // --- 核心逻辑：画面渲染 ---
        function draw() {
            // 清理画布
            ctx.fillStyle = '#110e1c'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. 绘制卡通蛇
            snake.forEach((segment, index) => {
                ctx.beginPath();
                
                if (index === 0) {
                    // 【画蛇头】
                    ctx.arc(segment.x, segment.y, radius * 1.3, 0, Math.PI * 2); 
                    ctx.fillStyle = '#4caf50'; // 卡通绿
                    ctx.fill();

                    // 绘制一双会随着前进方向灵活转动的大眼睛
                    let eyeOffsetAngle = 0.5; 
                    
                    // 左眼
                    let leftEyeX = segment.x + Math.cos(angle - eyeOffsetAngle) * 10;
                    let leftEyeY = segment.y + Math.sin(angle - eyeOffsetAngle) * 10;
                    ctx.beginPath();
                    ctx.arc(leftEyeX, leftEyeY, 5, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                    ctx.beginPath(); // 左瞳孔
                    ctx.arc(leftEyeX, leftEyeY, 2.5, 0, Math.PI * 2);
                    ctx.fillStyle = '#000000';
                    ctx.fill();

                    // 右眼
                    let rightEyeX = segment.x + Math.cos(angle + eyeOffsetAngle) * 10;
                    let rightEyeY = segment.y + Math.sin(angle + eyeOffsetAngle) * 10;
                    ctx.beginPath();
                    ctx.arc(rightEyeX, rightEyeY, 5, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                    ctx.beginPath(); // 右瞳孔
                    ctx.arc(rightEyeX, rightEyeY, 2.5, 0, Math.PI * 2);
                    ctx.fillStyle = '#000000';
                    ctx.fill();

                } else {
                    // 【画蛇身】
                    let bodyRadius = radius * (1 - index / (snake.length + 10));
                    ctx.arc(segment.x, segment.y, bodyRadius, 0, Math.PI * 2);
                    
                    // 深绿和浅绿相间的卡通花纹身体
                    ctx.fillStyle = index % 2 === 0 ? '#81c784' : '#4caf50';
                    ctx.fill();
                }
            });

            // 2. 绘制随机 Emoji 食物
            ctx.save();
            ctx.translate(food.x, food.y);
            let currentScale = food.pulse;
            ctx.scale(currentScale, currentScale); 
            
            ctx.font = "34px serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(food.type, 0, 0); 
            ctx.restore();

            // 3. 绘制 Game Over 遮罩大弹窗
            if (isGameOver) {
                // 黑色半透明滤镜
                ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // GAME OVER 霓虹粉大字
                ctx.fillStyle = '#ff2a74';
                ctx.font = 'bold 60px system-ui, -apple-system';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 30);

                // 重新开始提示
                ctx.fillStyle = '#ffffff';
                ctx.font = '22px system-ui, -apple-system';
                ctx.fillText('轻触屏幕或按键盘重新开始', canvas.width / 2, canvas.height / 2 + 40);
            }
        }

        // --- 游戏主循环 ---
        function loop() {
            update(); 
            draw();
            requestAnimationFrame(loop);
        }

        // --- 键盘监听（支持外接键盘） ---
        window.addEventListener('keydown', (e) => {
            if (isGameOver) {
                resetGame();
                return;
            }
            switch(e.key) {
                case 'ArrowUp':    targetAngle = -Math.PI / 2; break;
                case 'ArrowDown':  targetAngle = Math.PI / 2; break;
                case 'ArrowLeft':  targetAngle = Math.PI; break;
                case 'ArrowRight': targetAngle = 0; break;
            }
        });

        // --- iPad 触屏手势监听 ---
        let touchStartX = 0;
        let touchStartY = 0;

        window.addEventListener('touchstart', (e) => {
            // 如果处于 Game Over 状态，点击屏幕直接重新开始复活
            if (isGameOver) {
                resetGame();
                return;
            }
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!touchStartX || !touchStartY || isGameOver) return;

            let touchEndX = e.touches[0].clientX;
            let touchEndY = e.touches[0].clientY;

            let dx = touchEndX - touchStartX;
            let dy = touchEndY - touchStartY;

            // 滑动超过 20 像素就改变蛇的前进方向
            if (Math.abs(dx) > 20 || Math.abs(dy) > 20) {
                targetAngle = Math.atan2(dy, dx); 
                touchStartX = touchEndX;
                touchStartY = touchEndY;
            }
        }, { passive: true });

        // 启动
        loop();
    </script>
</body>
</html>
