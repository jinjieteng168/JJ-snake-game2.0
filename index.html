<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JJ snake game 2.0</title></title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: radial-gradient(circle, #1a1a2e 0%, #0f0c1b 100%);
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            /* 阻止 iPad 浏览器自带的橡皮筋回弹刷新手势 */
            touch-action: none; 
        }
        #game-container {
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }
        canvas {
            display: block;
            background: #110e1c;
        }
        #ui-layer {
            position: absolute;
            top: 25px;
            left: 25px;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 0 4px 8px rgba(0,0,0,0.5);
            pointer-events: none;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui-layer">SCORE: <span id="score">000</span></div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');

        // --- 核心变量 ---
        let snake = [
            {x: 400, y: 300},
            {x: 385, y: 300},
            {x: 370, y: 300},
            {x: 355, y: 300}
        ];
        
        let radius = 12;       
        let speed = 4;         
        let angle = 0;         
        let targetAngle = 0;   
        let score = 0;

        let food = {
            x: 0,
            y: 0,
            radius: 8,
            pulse: 1 
        };

        function respawnFood() {
            food.x = Math.random() * (canvas.width - 100) + 50;
            food.y = Math.random() * (canvas.height - 100) + 50;
        }

        // 初始化生成第一个食物
        respawnFood();

        // --- 核心逻辑：数据更新 ---
        function update() {
            // 角度平滑漂移过渡
            let angleDiff = targetAngle - angle;
            angleDiff = Math.atan2(Math.sin(angleDiff), Math.cos(angleDiff));
            angle += angleDiff * 0.2; 

            // 计算蛇头位置
            let head = {
                x: snake[0].x + Math.cos(angle) * speed,
                y: snake[0].y + Math.sin(angle) * speed
            };

            // 穿墙判定
            if (head.x > canvas.width) head.x = 0;
            if (head.x < 0) head.x = canvas.width;
            if (head.y > canvas.height) head.y = 0;
            if (head.y < 0) head.y = canvas.height;

            snake.unshift(head);

            // 碰撞检测：吃食物
            let dx = head.x - food.x;
            let dy = head.y - food.y;
            let distance = Math.sqrt(dx * dx + dy * dy); 

            if (distance < radius + food.radius) {
                score += 10;
                scoreEl.innerText = score.toString().padStart(3, '0');
                respawnFood();
                speed += 0.1; 
            } else {
                snake.pop();
            }

            // 自撞检测（前15节不检测，防止转弯直接卡死）
            for (let i = 15; i < snake.length; i++) {
                let sDx = head.x - snake[i].x;
                let sDy = head.y - snake[i].y;
                let sDist = Math.sqrt(sDx * sDx + sDy * sDy);
                if (sDist < radius * 0.8) {
                    resetGame();
                }
            }

            // 食物呼吸灯动效
            food.pulse = 1 + Math.sin(Date.now() * 0.005) * 0.2;
        }

        // 游戏重置
        function resetGame() {
            score = 0;
            speed = 4;
            angle = 0;
            targetAngle = 0;
            scoreEl.innerText = "000";
            snake = [
                {x: 400, y: 300},
                {x: 385, y: 300},
                {x: 370, y: 300},
                {x: 355, y: 300}
            ];
            respawnFood();
        }

        // --- 核心逻辑：画面渲染 ---
        function draw() {
            // 带有微弱半透明的清除，形成科幻尾迹
            ctx.fillStyle = 'rgba(17, 14, 28, 0.3)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制蛇身
            snake.forEach((segment, index) => {
                ctx.beginPath();
                ctx.arc(segment.x, segment.y, radius * (1 - index/snake.length * 0.3), 0, Math.PI * 2); 
                let alpha = 1 - (index / snake.length) * 0.5;
                ctx.fillStyle = `rgba(0, 242, 254, ${alpha})`;
                ctx.shadowBlur = index === 0 ? 20 : 0;
                ctx.shadowColor = '#00f2fe';
                ctx.fill();
                ctx.shadowBlur = 0; 
            });

            // 绘制粉色发光食物
            ctx.beginPath();
            let currentFoodRadius = food.radius * food.pulse;
            ctx.arc(food.x, food.y, currentFoodRadius, 0, Math.PI * 2);
            ctx.fillStyle = '#ff2a74';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff2a74';
            ctx.fill();
            ctx.shadowBlur = 0; 
        }

        // --- 游戏循环 ---
        function loop() {
            update(); 
            draw();
            requestAnimationFrame(loop);
        }

        // --- 键盘监听（兼容外接键盘） ---
        window.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowUp':    targetAngle = -Math.PI / 2; break;
                case 'ArrowDown':  targetAngle = Math.PI / 2; break;
                case 'ArrowLeft':  targetAngle = Math.PI; break;
                case 'ArrowRight': targetAngle = 0; break;
            }
        });

        // --- iPad 纯触屏滑动手势控制（全屏可滑，360度方向漂移） ---
        let touchStartX = 0;
        let touchStartY = 0;

        window.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!touchStartX || !touchStartY) return;

            let touchEndX = e.touches[0].clientX;
            let touchEndY = e.touches[0].clientY;

            let dx = touchEndX - touchStartX;
            let dy = touchEndY - touchStartY;

            if (Math.abs(dx) > 20 || Math.abs(dy) > 20) {
                targetAngle = Math.atan2(dy, dx); // 顺着手指滑动的任意角度游动
                touchStartX = touchEndX;
                touchStartY = touchEndY;
            }
        }, { passive: true });

        // 启动游戏
        loop();
    </script>
</body>
</html>
