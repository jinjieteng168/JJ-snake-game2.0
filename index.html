<!DOCTYPE html>
<script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');

        // --- 核心配置 ---
        let snake = [
            {x: 400, y: 300},
            {x: 385, y: 300},
            {x: 370, y: 300},
            {x: 355, y: 300}
        ];
        
        let radius = 12;       
        let speed = 4;         
        let angle = 0;         
        let targetAngle = 0;   
        let score = 0;

        // 食物属性
        let food = {
            x: 0,
            y: 0,
            radius: 8,
            pulse: 1 
        };

        function respawnFood() {
            food.x = Math.random() * (canvas.width - 100) + 50;
            food.y = Math.random() * (canvas.height - 100) + 50;
        }

        // 初始化食物
        respawnFood();

        // --- 核心逻辑：数据更新 ---
        function update() {
            // 1. 角度平滑过渡
            let angleDiff = targetAngle - angle;
            angleDiff = Math.atan2(Math.sin(angleDiff), Math.cos(angleDiff));
            angle += angleDiff * 0.2; 

            // 2. 计算蛇头新位置
            let head = {
                x: snake[0].x + Math.cos(angle) * speed,
                y: snake[0].y + Math.sin(angle) * speed
            };

            // 穿墙检测
            if (head.x > canvas.width) head.x = 0;
            if (head.x < 0) head.x = canvas.width;
            if (head.y > canvas.height) head.y = 0;
            if (head.y < 0) head.y = canvas.height;

            snake.unshift(head);

            // 3. 碰撞检测：吃到食物
            let dx = head.x - food.x;
            let dy = head.y - food.y;
            let distance = Math.sqrt(dx * dx + dy * dy); 

            if (distance < radius + food.radius) {
                score += 10;
                scoreEl.innerText = score.toString().padStart(3, '0');
                respawnFood();
                speed += 0.1; // 逐渐变快
            } else {
                snake.pop();
            }

            // 4. 自撞检测（从第15节开始算，给转弯留出空间）
            for (let i = 15; i < snake.length; i++) {
                let sDx = head.x - snake[i].x;
                let sDy = head.y - snake[i].y;
                let sDist = Math.sqrt(sDx * sDx + sDy * sDy);
                if (sDist < radius * 0.8) {
                    resetGame();
                }
            }

            // 食物呼吸动效
            food.pulse = 1 + Math.sin(Date.now() * 0.005) * 0.2;
        }

        // 游戏重置
        function resetGame() {
            score = 0;
            speed = 4;
            angle = 0;
            targetAngle = 0;
            scoreEl.innerText = "000";
            snake = [
                {x: 400, y: 300},
                {x: 385, y: 300},
                {x: 370, y: 300},
                {x: 355, y: 300}
            ];
            respawnFood();
        }

        // --- 核心逻辑：画面渲染 ---
        function draw() {
            ctx.fillStyle = 'rgba(17, 14, 28, 0.3)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘蛇
            snake.forEach((segment, index) => {
                ctx.beginPath();
                ctx.arc(segment.x, segment.y, radius * (1 - index/snake.length * 0.3), 0, Math.PI * 2); 
                let alpha = 1 - (index / snake.length) * 0.5;
                ctx.fillStyle = `rgba(0, 242, 254, ${alpha})`;
                ctx.shadowBlur = index === 0 ? 20 : 0;
                ctx.shadowColor = '#00f2fe';
                ctx.fill();
                ctx.shadowBlur = 0; 
            });

            // 绘食物
            ctx.beginPath();
            let currentFoodRadius = food.radius * food.pulse;
            ctx.arc(food.x, food.y, currentFoodRadius, 0, Math.PI * 2);
            ctx.fillStyle = '#ff2a74';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff2a74';
            ctx.fill();
            ctx.shadowBlur = 0; 
        }

        // --- 游戏主循环 ---
        function loop() {
            update(); // 现在的循环变得非常干净
            draw();
            requestAnimationFrame(loop);
        }

        // --- 键盘监听 ---
        window.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowUp':    targetAngle = -Math.PI / 2; break;
                case 'ArrowDown':  targetAngle = Math.PI / 2; break;
                case 'ArrowLeft':  targetAngle = Math.PI; break;
                case 'ArrowRight': targetAngle = 0; break;
                            // --- 新增：iPad 触屏手势监听 ---
        let touchStartX = 0;
        let touchStartY = 0;

        window.addEventListener('touchstart', (e) => {
            // 记录手指刚碰屏幕时的坐标
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!touchStartX || !touchStartY) return;

            let touchEndX = e.touches[0].clientX;
            let touchEndY = e.touches[0].clientY;

            // 计算滑动的 x 和 y 轴距离
            let dx = touchEndX - touchStartX;
            let dy = touchEndY - touchStartY;

            // 只有当滑动距离大于 30 像素时才触发转向，防止误触
            if (Math.abs(dx) > 30 || Math.abs(dy) > 30) {
                // 利用数学公式 Math.atan2 直接算出手指滑动的绝对角度
                targetAngle = Math.atan2(dy, dx);
                
                // 重置起点，方便连续滑动转向
                touchStartX = touchEndX;
                touchStartY = touchEndY;
            }
        }, { passive: true });
            }
        });

        // 启动
        loop();
    </script>
