<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title> JJ snake game 2.0</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: radial-gradient(circle, #251c4a 0%, #0e091a 100%);
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            /* 允许非冲突的触屏行为 */
            touch-action: none; 
            -webkit-user-select: none; /* 防止手机上长按变蓝选中文本 */
            user-select: none;
        }
        #game-container {
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            /* 优化：让画布在手机上最大宽度为 100%，自动等比例缩小，不会滑出屏幕 */
            width: 95vw;
            max-width: 800px;
            aspect-ratio: 4 / 3; 
        }
        canvas {
            display: block;
            background: #110e1c;
            width: 100%;
            height: 100%;
        }
        #ui-layer {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 20px; /* 稍微缩小一点，适合手机 */
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 0 4px 8px rgba(0,0,0,0.5);
            pointer-events: none;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui-layer">SCORE: <span id="score">000</span></div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');

        // --- Core Variables ---
        let snake = [
            {x: 400, y: 300},
            {x: 385, y: 300},
            {x: 370, y: 300},
            {x: 355, y: 300}
        ];
        
        let radius = 12;       
        let speed = 5;         
        let angle = 0;         
        let targetAngle = 0;   
        let score = 0;
        let isGameOver = false; 
        let growPending = 0;   

        // Food Attributes
        let food = {
            x: 0,
            y: 0,
            radius: 16, 
            pulse: 1,
            type: '🍎'   
        };

        const foodPool = ['🍎', '🍌', '🍓', '🍩', '🍕', '🍇', '🍉', '🥑', '🍔', '🍟', '🍦', '🍰'];

        function respawnFood() {
            food.x = Math.random() * (canvas.width - 100) + 50;
            food.y = Math.random() * (canvas.height - 100) + 50;
            food.type = foodPool[Math.floor(Math.random() * foodPool.length)];
        }

        respawnFood();

        // --- Core Logic: Update ---
        function update() {
            if (isGameOver) return; 

            let angleDiff = targetAngle - angle;
            angleDiff = Math.atan2(Math.sin(angleDiff), Math.cos(angleDiff));
            angle += angleDiff * 0.2; 

            let head = {
                x: snake[0].x + Math.cos(angle) * speed,
                y: snake[0].y + Math.sin(angle) * speed
            };

            // Wall Collision Check
            if (head.x > canvas.width || head.x < 0 || head.y > canvas.height || head.y < 0) {
                isGameOver = true;
                return;
            }

            snake.unshift(head);

            // Food Collision Check
            let dx = head.x - food.x;
            let dy = head.y - food.y;
            let distance = Math.sqrt(dx * dx + dy * dy); 

            if (distance < radius + food.radius) {
                score += 10;
                scoreEl.innerText = score.toString().padStart(3, '0');
                respawnFood();
                speed += 0.15; 
                growPending += 3; 
            }

            if (growPending > 0) {
                growPending--; 
            } else {
                snake.pop(); 
            }

            // Self Collision Check
            for (let i = 15; i < snake.length; i++) {
                let sDx = head.x - snake[i].x;
                let sDy = head.y - snake[i].y;
                let sDist = Math.sqrt(sDx * sDx + sDy * sDy);
                if (sDist < radius * 0.8) {
                    isGameOver = true; 
                    return;
                }
            }

            food.pulse = 1 + Math.sin(Date.now() * 0.005) * 0.15;
        }

        function resetGame() {
            score = 0;
            speed = 6; 
            angle = 0;
            targetAngle = 0;
            isGameOver = false;
            growPending = 0; 
            scoreEl.innerText = "000";
            snake = [
                {x: 400, y: 300},
                {x: 385, y: 300},
                {x: 370, y: 300},
                {x: 355, y: 300}
            ];
            respawnFood();
        }

        // --- Core Logic: Draw ---
        function draw() {
            ctx.fillStyle = '#110e1c'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Cartoon Snake
            snake.forEach((segment, index) => {
                ctx.beginPath();
                
                if (index === 0) {
                    // Head
                    ctx.arc(segment.x, segment.y, radius * 1.3, 0, Math.PI * 2); 
                    ctx.fillStyle = '#4caf50'; 
                    ctx.fill();

                    // Animated Eyes
                    let eyeOffsetAngle = 0.5; 
                    
                    // Left Eye
                    let leftEyeX = segment.x + Math.cos(angle - eyeOffsetAngle) * 10;
                    let leftEyeY = segment.y + Math.sin(angle - eyeOffsetAngle) * 10;
                    ctx.beginPath();
                    ctx.arc(leftEyeX, leftEyeY, 5, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                    ctx.beginPath(); 
                    ctx.arc(leftEyeX, leftEyeY, 2.5, 0, Math.PI * 2);
                    ctx.fillStyle = '#000000';
                    ctx.fill();

                    // Right Eye
                    let rightEyeX = segment.x + Math.cos(angle + eyeOffsetAngle) * 10;
                    let rightEyeY = segment.y + Math.sin(angle + eyeOffsetAngle) * 10;
                    ctx.beginPath();
                    ctx.arc(rightEyeX, rightEyeY, 5, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                    ctx.beginPath(); 
                    ctx.arc(rightEyeX, rightEyeY, 2.5, 0, Math.PI * 2);
                    ctx.fillStyle = '#000000';
                    ctx.fill();

                } else {
                    // Body segments
                    let bodyRadius = radius * (1 - index / (snake.length + 10));
                    ctx.arc(segment.x, segment.y, bodyRadius, 0, Math.PI * 2);
                    ctx.fillStyle = index % 2 === 0 ? '#81c784' : '#4caf50';
                    ctx.fill();
                }
            });

            // 2. Draw Food
            ctx.save();
            ctx.translate(food.x, food.y);
            let currentScale = food.pulse;
            ctx.scale(currentScale, currentScale); 
            
            ctx.font = "34px serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(food.type, 0, 0); 
            ctx.restore();

            // 3. Draw Game Over Menu
            if (isGameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#ff2a74';
                ctx.font = 'bold 45px system-ui, -apple-system'; // 手机端稍微缩小字体
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 30);

                ctx.fillStyle = '#ffffff';
                ctx.font = '16px system-ui, -apple-system'; // 手机端稍微缩小字体
                ctx.fillText('TAP SCREEN TO RESTART', canvas.width / 2, canvas.height / 2 + 40);
            }
        }

        function loop() {
            update(); 
            draw();
            requestAnimationFrame(loop);
        }

        // --- Controls: Keyboard Listener ---
        window.addEventListener('keydown', (e) => {
            if (isGameOver) {
                resetGame();
                return;
            }
            switch(e.key) {
                case 'ArrowUp':    targetAngle = -Math.PI / 2; break;
                case 'ArrowDown':  targetAngle = Math.PI / 2; break;
                case 'ArrowLeft':  targetAngle = Math.PI; break;
                case 'ArrowRight': targetAngle = 0; break;
            }
        });

        // --- Controls: Fixed Touch Listener for Phones ---
        let touchStartX = 0;
        let touchStartY = 0;

        window.addEventListener('touchstart', (e) => {
            if (isGameOver) {
                resetGame();
                return;
            }
            // 记录手机手指碰触位置
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!touchStartX || !touchStartY || isGameOver) return;

            let touchEndX = e.touches[0].clientX;
            let touchEndY = e.touches[0].clientY;

            let dx = touchEndX - touchStartX;
            let dy = touchEndY - touchStartY;

            // 核心优化：降低触发门槛（大于10像素就立刻转向），让手机短距离划动更灵敏
            if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
                targetAngle = Math.atan2(dy, dx); 
                // 实时更新起点，让连续的手势划动极度跟手
                touchStartX = touchEndX;
                touchStartY = touchEndY;
            }
        }, { passive: true });

        loop();
    </script>
</body>
</html>
