<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JJ snake game 2.0</title></title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: radial-gradient(circle, #1a1a2e 0%, #0f0c1b 100%);
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            /* 阻止 iPad 浏览器自带的橡皮筋回弹刷新手势 */
            touch-action: none; 
        }
        #game-container {
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }
        canvas {
            display: block;
            background: #110e1c;
        }
        #ui-layer {
            position: absolute;
            top: 25px;
            left: 25px;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 0 4px 8px rgba(0,0,0,0.5);
            pointer-events: none;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui-layer">SCORE: <span id="score">000</span></div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');

        // --- 核心变量 ---
        let snake = [
            {x: 400, y: 300},
            {x: 385, y: 300},
            {x: 370, y: 300},
            {x: 355, y: 300}
        ];
        
        let radius = 12;       
        let speed = 4;         
        let angle = 0;         
        let targetAngle = 0;   
        let score = 0;

        let food = {
    x: 0,
    y: 0,
    radius: 16, // 把碰撞半径放大一点，因为卡通图标比较大
    pulse: 1,
    type: '🍎'   // 新增：记录当前食物的图标
};

// 各种卡通食物池
const foodPool = ['🍎', '🍌', '🍓', '🍩', '🍕', '🍇', '🍉', '🥑', '🍔', '🍟'];

        function respawnFood() {
    food.x = Math.random() * (canvas.width - 100) + 50;
    food.y = Math.random() * (canvas.height - 100) + 50;
    // 每次刷新，随机挑一个不同的食物图标！
    food.type = foodPool[Math.floor(Math.random() * foodPool.length)];
}

        // 初始化生成第一个食物
        respawnFood();

        // --- 核心逻辑：数据更新 ---
        function update() {
            // 角度平滑漂移过渡
            let angleDiff = targetAngle - angle;
            angleDiff = Math.atan2(Math.sin(angleDiff), Math.cos(angleDiff));
            angle += angleDiff * 0.2; 

            // 计算蛇头位置
            let head = {
                x: snake[0].x + Math.cos(angle) * speed,
                y: snake[0].y + Math.sin(angle) * speed
            };

            // 穿墙判定
            if (head.x > canvas.width) head.x = 0;
            if (head.x < 0) head.x = canvas.width;
            if (head.y > canvas.height) head.y = 0;
            if (head.y < 0) head.y = canvas.height;

            snake.unshift(head);

            // 碰撞检测：吃食物
            let dx = head.x - food.x;
            let dy = head.y - food.y;
            let distance = Math.sqrt(dx * dx + dy * dy); 

            if (distance < radius + food.radius) {
                score += 10;
                scoreEl.innerText = score.toString().padStart(3, '0');
                respawnFood();
                speed += 0.1; 
            } else {
                snake.pop();
            }

            // 自撞检测（前15节不检测，防止转弯直接卡死）
            for (let i = 15; i < snake.length; i++) {
                let sDx = head.x - snake[i].x;
                let sDy = head.y - snake[i].y;
                let sDist = Math.sqrt(sDx * sDx + sDy * sDy);
                if (sDist < radius * 0.8) {
                    resetGame();
                }
            }

            // 食物呼吸灯动效
            food.pulse = 1 + Math.sin(Date.now() * 0.005) * 0.2;
        }

        // 游戏重置
        function resetGame() {
            score = 0;
            speed = 4;
            angle = 0;
            targetAngle = 0;
            scoreEl.innerText = "000";
            snake = [
                {x: 400, y: 300},
                {x: 385, y: 300},
                {x: 370, y: 300},
                {x: 355, y: 300}
            ];
            respawnFood();
        }

        // --- 核心逻辑：画面渲染 ---
// --- 核心逻辑：画面渲染 ---
        function draw() {
            // 纯黑背景，取消科幻拖尾，让卡通画面更干净
            ctx.fillStyle = '#110e1c'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. 绘制卡通蛇身
            snake.forEach((segment, index) => {
                ctx.beginPath();
                
                if (index === 0) {
                    // 【这是蛇头】
                    ctx.arc(segment.x, segment.y, radius * 1.3, 0, Math.PI * 2); // 蛇头稍微大一点
                    ctx.fillStyle = '#4caf50'; // 活泼的卡通绿
                    ctx.fill();

                    // 给蛇头画上可爱的卡通眼睛
                    // 根据当前运动的 angle（弧度）来计算眼睛的位置，让它看向前进方向
                    let eyeOffsetAngle = 0.5; // 左右两只眼睛的角度偏离
                    
                    // 左眼
                    let leftEyeX = segment.x + Math.cos(angle - eyeOffsetAngle) * 10;
                    let leftEyeY = segment.y + Math.sin(angle - eyeOffsetAngle) * 10;
                    ctx.beginPath();
                    ctx.arc(leftEyeX, leftEyeY, 4, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                    ctx.beginPath(); // 瞳孔
                    ctx.arc(leftEyeX, leftEyeY, 2, 0, Math.PI * 2);
                    ctx.fillStyle = '#000000';
                    ctx.fill();

                    // 右眼
                    let rightEyeX = segment.x + Math.cos(angle + eyeOffsetAngle) * 10;
                    let rightEyeY = segment.y + Math.sin(angle + eyeOffsetAngle) * 10;
                    ctx.beginPath();
                    ctx.arc(rightEyeX, rightEyeY, 4, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                    ctx.beginPath(); // 瞳孔
                    ctx.arc(rightEyeX, rightEyeY, 2, 0, Math.PI * 2);
                    ctx.fillStyle = '#000000';
                    ctx.fill();

                } else {
                    // 【这是蛇身】
                    // 身体随着往后稍微变细一点点，看起来更像蛇
                    let bodyRadius = radius * (1 - index / (snake.length + 10));
                    ctx.arc(segment.x, segment.y, bodyRadius, 0, Math.PI * 2);
                    
                    // 让身体呈现浅绿、深绿相间的卡通花纹
                    ctx.fillStyle = index % 2 === 0 ? '#81c784' : '#4caf50';
                    ctx.fill();
                }
            });

            // 2. 绘制卡通食物（Emoji）
            ctx.save();
            ctx.translate(food.x, food.y);
            // 给食物加一点卡通的呼吸缩放动画
            let currentScale = food.pulse;
            ctx.scale(currentScale, currentScale);
            
            // 绘制文字/Emoji 居中对齐
            ctx.font = "32px serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(food.type, 0, 0); // 绘制当前的随机卡通食物
            ctx.restore();
        }
            // 绘制粉色发光食物
            ctx.beginPath();
            let currentFoodRadius = food.radius * food.pulse;
            ctx.arc(food.x, food.y, currentFoodRadius, 0, Math.PI * 2);
            ctx.fillStyle = '#ff2a74';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff2a74';
            ctx.fill();
            ctx.shadowBlur = 0; 
        }

        // --- 游戏循环 ---
        function loop() {
            update(); 
            draw();
            requestAnimationFrame(loop);
        }

        // --- 键盘监听（兼容外接键盘） ---
        window.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowUp':    targetAngle = -Math.PI / 2; break;
                case 'ArrowDown':  targetAngle = Math.PI / 2; break;
                case 'ArrowLeft':  targetAngle = Math.PI; break;
                case 'ArrowRight': targetAngle = 0; break;
            }
        });

        // --- iPad 纯触屏滑动手势控制（全屏可滑，360度方向漂移） ---
        let touchStartX = 0;
        let touchStartY = 0;

        window.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!touchStartX || !touchStartY) return;

            let touchEndX = e.touches[0].clientX;
            let touchEndY = e.touches[0].clientY;

            let dx = touchEndX - touchStartX;
            let dy = touchEndY - touchStartY;

            if (Math.abs(dx) > 20 || Math.abs(dy) > 20) {
                targetAngle = Math.atan2(dy, dx); // 顺着手指滑动的任意角度游动
                touchStartX = touchEndX;
                touchStartY = touchEndY;
            }
        }, { passive: true });

        // 启动游戏
        loop();
    </script>
</body>
</html>
